name: Build Agent EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: pip install pyinstaller websockets requests
    - run: pyinstaller --onefile --noconsole agent.py
    - uses: actions/upload-artifact@v4
      with:
        name: MT5-Agent
        path: dist/agent.exe
